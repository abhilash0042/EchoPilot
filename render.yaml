services:
  - type: web
    name: echopilot-voice-agent
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -e ./sdk -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BELFRY_BASE_URL
        value: https://app.belfrylabs.ai/api/v1
      - key: BELFRY_TENANT_ID
        value: tenant_63fb285afe99fd0d
      - key: BELFRY_PROJECT_ID
        value: proj_bf8aa49e70f6
      - key: BELFRY_API_KEY
        sync: false
      - key: BELFRY_DEMO_MODE
        value: "0"
